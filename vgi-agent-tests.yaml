# Private graders for the public vgi.agent_test_tasks in the worker's catalog metadata.
# `make lint-ai` runs an agent on each prompt and grades it with these, with the worker
# attached to the mock bridge (test/mock_bridge/server.py), whose state the control tasks change.
# See https://github.com/Query-farm/vgi-lint-check (VGI920).
tasks:
  - name: lights_on_per_room
    reference_sql: >-
      SELECT room, count(*) FILTER (WHERE is_on) AS lights_on
      FROM hue.main.lights GROUP BY room ORDER BY room
  - name: active_scenes
    reference_sql: SELECT room, name FROM hue.main.scenes WHERE active ORDER BY room
  - name: biggest_room
    reference_sql: >-
      SELECT name FROM hue.main.rooms WHERE kind = 'room' ORDER BY light_count DESC, name LIMIT 1
  - name: warmest_room
    reference_sql: >-
      SELECT room FROM hue.main.sensors WHERE kind = 'temperature'
      ORDER BY temperature_c DESC LIMIT 1
  - name: kitchen_off
    reference_sql: SELECT target_type, name, ok FROM hue.main.set_room('Kitchen', power := false)
  - name: dim_sofa
    reference_sql: SELECT name, ok FROM hue.main.set_light('Sofa lamp', brightness := 30)
  - name: relax_living_room
    reference_sql: SELECT name, ok FROM hue.main.recall_scene('Relax', room := 'Living room')
  - name: warm_white_everywhere
    reference_sql: >-
      SELECT count(*) FILTER (WHERE ok) AS changed FROM hue.main.set_lights(
        (SELECT light_id, name FROM hue.main.lights WHERE color_mode IS NOT NULL), kelvin := 2700)
